name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          PROJECT_PATH="$(find . -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "No .xcodeproj found in repository."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "Found project: $PROJECT_PATH"
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: Show schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project "${{ steps.project.outputs.project_path }}"

      - name: Archive
        run: |
          xcodebuild archive -project "${{ steps.project.outputs.project_path }}" -scheme EnglishAITutor -configuration Release -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/EnglishAITutor.xcarchive" CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          APP_PATH="$RUNNER_TEMP/EnglishAITutor.xcarchive/Products/Applications/EnglishAITutor.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/EnglishAITutor_unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAITutor-unsigned-IPA
          path: EnglishAITutor_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
